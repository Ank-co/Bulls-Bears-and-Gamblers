[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbg"
version = "0.1.0"
description = "Bulls, bears and gamblers: pre-registered experiments on language models in markets (sentiment, advice, prices, belief updating)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Antoine David" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
