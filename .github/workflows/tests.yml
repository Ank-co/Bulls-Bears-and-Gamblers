# Unit tests on CPU (no GPU, no model download: the tests build a tiny random Qwen),
# and a scan of the pinned dependencies for known vulnerabilities.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU PyTorch, then the project)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .
      - name: Unit tests
        run: python -m pytest -q tests

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Known vulnerabilities in the lock file
        run: |
          pip install pip-audit
          # torch is pinned with a CUDA local version (+cu128) that the vulnerability database does not index
          grep -v '^torch==' requirements.lock.txt > lock-audit.txt
          # PYSEC-2026-3447 (setuptools < 83, CVE-2026-59890): MANIFEST.in exclusions can miss
          # NFD-normalized file names on macOS when an sdist is built. This project never builds an
          # sdist and runs on Linux; torch 2.11 requires setuptools < 82, so the fix cannot be installed.
          pip-audit --requirement lock-audit.txt --no-deps --disable-pip --progress-spinner off \
            --ignore-vuln PYSEC-2026-3447
